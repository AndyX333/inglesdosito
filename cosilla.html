<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3e8ff;
            color: #4c1d95;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.15);
            width: 380px;
            text-align: center;
            border: 2px solid #ede9fe;
        }
        h2 {
            color: #6d28d9;
            margin-bottom: 20px;
        }
        .english-phrase {
            font-size: 18px;
            color: #5b21b6;
            font-weight: bold;
            margin: 15px 0;
        }
        .motivational-box {
            font-size: 16px;
            color: #7c3aed;
            font-style: italic;
            margin: 15px 0;
            padding: 10px;
            background-color: #faf5ff;
            border-radius: 8px;
        }
        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background-color: #8b5cf6;
            color: white;
            cursor: pointer;
            margin: 8px 4px;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #7c3aed;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-index {
            background-color: #c4b5fd;
            color: #3b0764;
            margin-top: 15px;
        }
        .btn-index:hover {
            background-color: #a78bfa;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="main-title">English Practice</h2>

        <!-- 1. Mostrar frase motivadora con botón (getElementById + innerHTML) -->
        <div id="image-box" class="motivational-box">Click the button for motivation!</div>
        <button id="btn-img" onclick="showMotivation()">Show Motivation</button>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ede9fe;">

        <!-- 2. Cambiar frase en inglés con botón (querySelector + innerHTML) -->
        <p class="english-phrase">"Hello, how are you today?"</p>
        <button onclick="changePhrase()">Change English Phrase</button>

        <br>

        <!-- 3. Botón que lleva a index.html -->
        <button class="btn-index" onclick="irAIndex()">Volver a Index</button>
    </div>

    <script>
        // Alerta superior (confirmación) al abrir la página
        window.onload = function() {
            const wantExamples = confirm("Welcome! Do you want to see interactive English examples?");
            
            if (!wantExamples) {
                document.getElementById("main-title").textContent = "Practice Mode (Paused)";
            }
        };

        // Función 1: Muestra una frase motivadora usando getElementById e innerHTML
        function showMotivation() {
            document.getElementById("image-box").innerHTML = "✨ 'Every expert was once a beginner.' ✨";
            document.getElementById("btn-img").style.backgroundColor = "#a78bfa";
        }

        // Función 2: Cambia la frase en inglés usando querySelector e innerHTML
        function changePhrase() {
            const phrase = document.querySelector(".english-phrase");
            phrase.innerHTML = '"Practice makes perfect! Keep going!"';
            phrase.style.color = "#7c3aed";
        }

        // Función 3: Redirigir a index.html
        function irAIndex() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
